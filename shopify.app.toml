# Boko AI Product Recommendations — app configuration
# Replace client_id and application_url after creating the app in the Partner dashboard.
# Run `shopify app config link` to sync, then `shopify app dev` / `shopify app deploy`.

client_id = "REPLACE_WITH_YOUR_CLIENT_ID"
name = "Boko AI Recommendations"
application_url = "https://REPLACE_WITH_YOUR_HOST"
embedded = true

[access_scopes]
scopes = "read_products,read_orders"

[auth]
redirect_urls = [
  "https://REPLACE_WITH_YOUR_HOST/api/auth/callback"
]

[app_proxy]
# Storefront widget calls https://<shop>/apps/reco/recommend -> your backend /proxy
url = "https://REPLACE_WITH_YOUR_HOST/proxy"
subpath = "reco"
prefix = "apps"

[webhooks]
api_version = "2024-10"

[pos]
embedded = false
