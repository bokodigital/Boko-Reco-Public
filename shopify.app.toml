# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5db55cf89a2c12312b4bb6e469a5cb93"
name = "AI Recommendations - By Boko"
application_url = "https://boko-reco-public.replit.app"
embedded = true

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app_uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_discounts,write_script_tags,write_themes"

[auth]
redirect_urls = [ "https://boko-reco-public.replit.app/auth/callback" ]

[app_proxy]
url = "https://boko-reco-public.replit.app/proxy"
subpath = "reco"
prefix = "apps"

